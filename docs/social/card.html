<!doctype html>
<!-- The 1200x630 share image (og:image). Rebuild: see docs/social/README.md -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Poiret One'; src: url('../../fonts/poiret-one-latin-400-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d0b08; }
  .card { position: relative; width: 1200px; height: 630px; display: flex; align-items: center;
    background: radial-gradient(ellipse at 78% 50%, #2a2114 0%, #0d0b08 70%); }
  .text { width: 640px; padding-left: 72px; color: #efe4c8; }
  h1 { font: 400 92px/1 'Poiret One', Georgia, serif; letter-spacing: .08em; margin: 0 0 18px;
    text-transform: uppercase; color: #e2c47f; }
  .rule { width: 140px; height: 3px; background: #b8914a; margin: 0 0 22px; }
  p { font: 500 34px/1.3 'Segoe UI', system-ui, sans-serif; margin: 0 0 16px; }
  small { font: 400 22px/1.4 'Segoe UI', system-ui, sans-serif; color: #b9a882; }
  .shot { position: absolute; right: 70px; top: 40px; width: 400px; height: 550px; overflow: hidden;
    clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    box-shadow: 0 0 0 2px #b8914a; }
  .shot img { width: 100%; display: block; }
</style></head>
<body><div class="card">
  <div class="text">
    <h1>BlankStare</h1>
    <div class="rule"></div>
    <p>Developer docs and error messages, in plain English.</p>
    <small>Free Chrome extension · English &amp; Greek · bring your own free key</small>
  </div>
  <div class="shot"><img src="../public/screenshots/sidepanel-result.png" alt=""></div>
</div></body></html>
