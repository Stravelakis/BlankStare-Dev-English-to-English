name: Deploy docs site

# Builds the docs site in /site (the shared docs-theme, repo standards §7)
# whenever site/ changes on main, or by hand from the Actions tab. Served at
# https://docs.stravelakis.com/BlankStare-Dev-English-to-English/ through the
# organisation site.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_DIR: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.DOCS_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.DOCS_DIR }}
      - run: npm run build
        working-directory: ${{ env.DOCS_DIR }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.DOCS_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
