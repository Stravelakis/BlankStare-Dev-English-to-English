# Checks the live docs site for speed, accessibility, best practices and SEO
# after every docs deploy (STANDARDS.md §7). Scores live in lighthouserc.json.
name: lighthouse

on:
  workflow_run:
    workflows: ["Deploy docs site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
